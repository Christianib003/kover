project_name: insuranceqa-chatbot
seed: 42

paths:
  raw_dir: data/raw/insuranceqa
  processed_dir: data/processed
  checkpoints_dir: results/checkpoints
  logs_dir: results/logs
  plots_dir: results/plots

model:
  name: google/flan-t5-base
  rag: false
  max_source_len: 256
  max_target_len: 128

train:
  batch_size: 8
  num_epochs: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_clip_norm: 1.0
  eval_steps: 200
  save_best_only: true
